# fly.toml app configuration file generated for foghaven on 2026-03-19T16:25:20-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'foghaven'
primary_region = 'lax'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = "foghaven"
  destination = "/db_share"

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
